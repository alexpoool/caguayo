# Caguayo ERP - Nginx reverse proxy
# Generated by deploy/scripts/install-production.sh
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name caguayo.home.arpa _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name caguayo.home.arpa _;
    root @APP_ROOT@/frontend/dist;
    index index.html;
    ssl_certificate     /etc/ssl/certs/caguayo.home.arpa.crt;
    ssl_certificate_key /etc/ssl/private/caguayo.home.arpa.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CaguayoSSL:10m;
    ssl_session_timeout 10m;
    server_tokens off;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
    # Server-Sent Events: no buffering so log streaming remains live.
    location = /api/v1/logs/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
    location ~* \.(?:js|css|svg|woff2?|png|jpe?g|gif|ico|webp)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
