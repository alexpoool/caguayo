org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ===== Velocidad de compilación =====
# Reusar resultados de tareas entre builds (build cache).
org.gradle.caching=true
# Compilación incremental para Kotlin (default true, explícito por claridad).
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m
# Configuration cache: evita re-evaluar el build en cada invocación (AGP 8.6+).
org.gradle.configuration-cache=true
